[tool.poetry]
# Baseline dependency manifest for the Python backend. S0-B (integration
# harness) seeds this with the libraries the harness + smoke suite need.
# Downstream backend sessions ADD their runtime deps here (FastAPI, Celery,
# Alembic, etc.) — this file is the single shared Poetry manifest.
name = "pid-backend"
version = "0.0.0"
description = "P&ID extraction platform backend — shared Poetry dependency manifest (harness baseline)."
authors = ["P&ID Build <noreply@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
# S1-E analytics emitter — PostHog SDK (self-hosted-compatible, §1.7/§1.8).
posthog = ">=3.0"
# S2-I scan worker — pyclamd TCP client for the ClamAV sidecar (stream-scan,
# no subprocess, no disk write). Runtime dep imported by app.workers.scan.
pyclamd = ">=0.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
sqlalchemy = "^2.0"
alembic = "^1.13"
# pydantic / pydantic-settings back app.config (S0-A) and are also required
# by the poetry venv that runs the integration suite — any test that imports
# app code (e.g. tests/integration/test_storage.py) imports app.config
# transitively. Listed once here for both S1-A's models and S1-C's storage.
pydantic = "^2.7"
pydantic-settings = "^2.3"
psycopg = { version = "^3.2", extras = ["binary"] }
# psycopg2 backs the default `postgresql://` dialect used by app.db.session
# (S0-A) at engine-construction import time; the test fixtures use psycopg v3.
psycopg2-binary = "^2.9"
redis = "^5.0"
boto3 = "^1.34"
# Runtime app deps imported by S0-A's scaffold (app.main, app.workers.celery_app,
# httpx-based tests). These need to be in the poetry venv too — otherwise pytest
# in CI hits ModuleNotFoundError when collecting the integration suite (which
# imports app.config / app.workers transitively).
celery = "^5.3"
fastapi = "^0.111"
uvicorn = { version = "^0.30", extras = ["standard"] }
httpx = "^0.27"
# S1-B (auth layer) — JWT verification + crypto.
pyjwt = { version = "^2.8", extras = ["crypto"] }
cryptography = "^42.0"
# In-process Redis double — needed by both S1-B (auth brute-force throttling)
# and S1-E (analytics dead-letter queue). Min version ^2.21 covers both.
fakeredis = "^2.21"

[tool.pytest.ini_options]
# NOTE: this config only applies when pytest is invoked from inside backend/.
# The integration smoke suite runs from the repo root against tests/integration
# and is fully synchronous, so it does not rely on this. Downstream sessions
# adding async tests under tests/integration must supply their own asyncio mode.
asyncio_mode = "auto"
