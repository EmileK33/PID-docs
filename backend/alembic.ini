# Alembic configuration. Run from the backend/ directory:  alembic upgrade head
#
# The actual database URL is supplied at runtime by env.py from settings
# (DATABASE_URL), so sqlalchemy.url below is an inert placeholder.
[alembic]
script_location = alembic

# Ensure the `app` package is importable when alembic runs from backend/.
prepend_sys_path = .

# Migration filenames: 0001_initial_schema.py, etc. (S1-A owns versions/).
file_template = %%(rev)s_%%(slug)s

# Inert placeholder — env.py overrides this with settings.DATABASE_URL.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
