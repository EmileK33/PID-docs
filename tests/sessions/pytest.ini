; Scoped pytest config for tests/sessions/ only.
;
; The mandated test filename `s0-a.test.py` is not a valid Python module name
; (hyphen + double `.test`), so pytest's default "prepend" import mode fails to
; collect it. `importlib` import mode loads it by path instead.
;
; This ini lives under tests/sessions/ (NOT the repo root) so it never alters
; config discovery for S0-B's `pytest tests/integration` runs.
[pytest]
addopts = --import-mode=importlib
python_files = *.test.py test_*.py *_test.py
