# CI/test override: ephemeral volumes (tmpfs), no host port clashes, fast
# healthchecks. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postgres redis
services:
  postgres:
    environment:
      POSTGRES_USER: pid
      POSTGRES_PASSWORD: pid
      POSTGRES_DB: pid_test
    # Ephemeral storage — no named volume persists between CI runs.
    volumes:
      - /var/lib/postgresql/data
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    environment:
      DATABASE_URL: postgresql://pid:pid@postgres:5432/pid_test
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development

  worker:
    environment:
      DATABASE_URL: postgresql://pid:pid@postgres:5432/pid_test
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development

# Named volume from the base file is left unused in test mode.
volumes:
  pgdata:
